<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eureka Simulations</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/main.css">
</head>
<body>
    <header class="hero">
        <h1>Eureka Simulations</h1>
    </header>

    <main class="container">
        <!-- Interactive filtering logic (No JavaScript required) -->
        <input type="radio" id="filter-all" name="category" checked>
        <input type="radio" id="filter-biology" name="category">
        <input type="radio" id="filter-chemistry" name="category">
        <input type="radio" id="filter-physics" name="category">

        <!-- Section Navigation Tabs -->
        <nav class="filters">
            <label for="filter-all">All</label>
            <label for="filter-biology">Biology</label>
            <label for="filter-chemistry">Chemistry</label>
            <label for="filter-physics">Physics</label>
        </nav>

        <!-- Simulation Cards -->
        <div class="grid">
            
            <!-- Physics -->
            <a href="physics/photoelectric-effect/index.html" class="card physics-card">
                <div class="card-content">
                    <div class="card-tag">Physics</div>
                    <h2>Photoelectric Effect</h2>
                </div>
            </a>

            <!-- Chemistry -->
            <a href="#" class="card chemistry-card">
                <div class="card-content">
                    <div class="card-tag">Chemistry</div>
                    <h2>Molecular Bonding</h2>
                </div>
            </a>

            <!-- Biology -->
            <a href="#" class="card biology-card">
                <div class="card-content">
                    <div class="card-tag">Biology</div>
                    <h2>Cell Division</h2>
                </div>
            </a>

        </div>
    </main>
</body>
</html>
