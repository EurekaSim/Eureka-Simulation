<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- THIS LINE IS THE FIX: It forces the phone to use mobile dimensions -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vector Projections - Eureka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-bar">
        <a href="../../index.html" class="back-link">← Back to Eureka</a>
        <div class="sim-title">Vector Projections</div>
    </nav>

    <div class="sim-container">
        <!-- Canvas Wrapper -->
        <div class="canvas-wrapper">
            <canvas id="vectorCanvas"></canvas>
        </div>

        <!-- Interactive Control Panel -->
        <div class="control-panel">
            <h3>Parameters</h3>
            
            <div class="control-group">
                <label for="magnitudeSlider">Magnitude (V): <span id="magValue">150</span></label>
                <input type="range" id="magnitudeSlider" min="10" max="250" value="150">
            </div>

            <div class="control-group">
                <label for="angleSlider">Angle (θ): <span id="angleValue">30</span>°</label>
                <input type="range" id="angleSlider" min="0" max="90" value="30">
            </div>

            <div class="readout-panel">
                <h3>Live Derivations</h3>
                <div class="readout-item">
                    <span>X-Axis Component</span>
                    <span class="formula">V_x = V · cos(θ)</span>
                    <span class="value x-val" id="xReadout">129.90</span>
                </div>
                <div class="readout-item">
                    <span>Y-Axis Component</span>
                    <span class="formula">V_y = V · sin(θ)</span>
                    <span class="value y-val" id="yReadout">75.00</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
